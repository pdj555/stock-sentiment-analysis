name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: CLI smoke test
        run: |
          python -m stock_sentiment --version
          python -m stock_sentiment -h > /dev/null
          python -m stock_sentiment ui --help > /dev/null
          stock-sentiment --version
          stock-sentiment analyze TSLA --help > /dev/null
          stock-sentiment ui --help > /dev/null
      - name: UI HTTP smoke test
        run: |
          python -m stock_sentiment ui --host 127.0.0.1 --port 8765 > /tmp/stock-sentiment-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill $ui_pid' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:8765/health"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      payload = json.load(response)
                  if payload == {"ok": True}:
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit(f"UI health endpoint did not become ready: {url}")
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile check
        run: |
          python -m compileall -q stock_sentiment main.py settings.py app.py
          python -m json.tool vercel.json > /dev/null
