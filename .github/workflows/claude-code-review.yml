name: Claude Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AI credentials
        uses: ./.github/actions/configure-ai
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ollama_api_key: ${{ secrets.OLLAMA_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OLLAMA_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ env.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ env.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_BASE_URL: ${{ env.OPENAI_BASE_URL }}
          OLLAMA_BASE_URL: ${{ env.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            You are the revenue gate for this pull request. Nothing matters except whether this change makes the product money or defends the money path. Profit. Income. That is the entire scoreboard.

            Use the repository tools to read the diff and the files it touches, then post EXACTLY ONE pull request review summarizing your verdict.

            Review with this lens, in priority order:

            1. REVENUE IMPACT
               - Does this ship, protect, or accelerate a paid capability (analyze CLI, UI surface, news ingestion, OpenAI classification, cached results)?
               - Does it unlock monetizable surface area (billing hooks, usage metering, entitlements, quota enforcement, conversion telemetry)?
               - If it is neutral or negative on revenue, say so bluntly and demand justification.

            2. SHIP BLOCKERS
               - Correctness bugs on the paid path. OpenAI prompt or schema drift. Cache corruption. News source regressions. Unsafe concurrency. Any crash reachable from `stock-sentiment analyze` or the UI server.
               - Security issues: injection, secret exposure, SSRF in news fetchers, unsafe deserialization, path traversal in cache.
               - Test coverage gaps that would let a money-path regression ship silently. Tests must stay offline (CLAUDE.md).

            3. WASTE AND DRAG
               - Speculative abstractions, unused configuration, dead code, over-generalized helpers, premature layering, backwards-compat hacks, defensive checks for impossible states. Call them out and demand deletion.
               - Bikeshedding, cosmetic churn, unrequested refactors. Reject them.

            4. SPEED TO SHIP
               - Can this merge today? If not, list the shortest possible path to green.

            Output format (single review, markdown):

            ## Verdict
            One of: SHIP IT / SHIP WITH FIXES / DO NOT SHIP. One sentence justifying it in revenue terms.

            ## Revenue Impact
            Concrete bullets. Name the paid surface or funnel step affected.

            ## Blockers
            Numbered list. File:line references. Each blocker states the failure mode and the fix.

            ## Waste to Cut
            Numbered list of code to delete or simplify, with file:line.

            ## Next Revenue Move
            One sentence. The highest-leverage follow-up this PR unlocks for generating income.

            Be direct. Be urgent. No hedging, no throat-clearing, no emoji. Write like the runway depends on this PR, because it does.
          claude_args: '--max-turns 15'
