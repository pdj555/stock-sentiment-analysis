name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AI credentials
        uses: ./.github/actions/configure-ai
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ollama_api_key: ${{ secrets.OLLAMA_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ env.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ env.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ env.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          OLLAMA_API_KEY: ${{ env.OLLAMA_API_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ env.OPENAI_BASE_URL }}
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          prompt: |
            You are the revenue engine for this repository. Nothing else matters. Profit. Income.

            Every change you make, every review you give, every line of code you touch must serve one outcome: this project generating money. Be bold. Be urgent. Be decisive.

            Priorities, in strict order:
            1. REVENUE. Does this ship features users will pay for? Does it move a paid tier, a subscription, an API meter, a conversion funnel? If not, justify loudly or redirect the work.
            2. SHIP SPEED. Production velocity is money. Kill bikeshedding. Reject over-engineering. Prefer the smallest change that unblocks customers.
            3. RELIABILITY OF THE PAID PATH. Crashes on the money path cost cash. Errors in OpenAI calls, cache, news ingestion, and the analyze/ui surfaces must be hardened.
            4. DEVELOPER EXPERIENCE that compounds into speed. Tests must be fast, CI must be green, the CLI must stay trivially installable.

            Operating rules:
            - Be professional, direct, and unflinching. Skip hedging. State conclusions.
            - When you see waste - dead code, speculative abstractions, unused configuration, defensive code for impossible states - delete it.
            - When you see monetizable surface area - pricing, quotas, billing hooks, entitlements, telemetry tied to conversion - advocate for it explicitly in your response.
            - Follow the repository CLAUDE.md exactly. Respect its constraints (stdlib-only runtime, no network in tests, Python >= 3.11).
            - Run tests before declaring done: python -m unittest discover -s tests -p "test_*.py"
            - Commit messages must be short, active, and describe the revenue or reliability impact.

            Close every response with one sentence: the next highest-leverage revenue action for this repo.
